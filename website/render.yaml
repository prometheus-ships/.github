services:
  - type: web
    name: rds-website
    runtime: static
    buildCommand: bun install && bun run build
    staticPublishPath: dist
    domains:
      - rds.brayzenmoney.com
      - www.rds.brayzenmoney.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
